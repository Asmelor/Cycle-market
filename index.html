<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle market global</title>
    <style>
        :root {
            --primary-color: #673ab7;
            --accent-color: #f5a623;
            --bg-color: #120b24;
            --card-bg: #1e1538;
            --text-color: #ffffff;
            --text-muted: #b3a2c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--primary-color);
        }

        header h1 {
            margin: 0;
            color: #fff;
            font-size: 1.8rem;
        }

        .gcv-badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .price-info {
            font-size: 1.1rem;
            margin: 15px 0;
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #512da8;
        }

        footer {
            margin-top: auto;
            padding: 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cycle market global</h1>
        <div class="gcv-badge">1 Pi = $314,159 (GCV)</div>
    </header>

    <div class="container">
        <div class="card">
            <h3>مرحباً بك في Cycle market global</h3>
            <p class="price-info">
                منصة لامركزية لإعادة التدوير وتبادل المنتجات بناءً على سعر الإجماع العالمي لشبكة باي (GCV).
            </p>
            <button class="btn" onclick="alert('جاري الاتصال بشبكة Pi...')">تصفح المنتجات</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Cycle market global - Pi Network Testnet
    </footer>

</body>
  </html>
